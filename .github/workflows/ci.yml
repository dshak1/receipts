name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build landing site
        run: npm ci --prefix site --no-audit --no-fund && npm run build --prefix site
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify package contents
        run: npm pack --workspace packages/harness --dry-run
